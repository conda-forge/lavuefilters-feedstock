schema_version: 1

context:
  version: "1.3.0"

package:
  name: lavuefilters
  version: ${{ version }}

source:
  url: https://github.com/lavue-org/lavue-filters/archive/refs/tags/v${{ version }}.tar.gz
  sha256: f24c9ba7d8598b2e972c96a473a36328d7a56119a997c375db348c8dab7f8c13

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - lavue
    - h5py

tests:
  - python:
      imports:
        - lavuefilters
        - lavuefilters.memplugins
        - lavuefilters.h5pyplugins

      python_version:
        - ${{ python_min }}.*
        - "*"


about:
  homepage: https://github.com/lavue-org/lavue-filters
  repository: https://github.com/lavue-org/lavue-filters
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Live Image Viewer plugins
  description: |
    LaVue Filters package contains a simple implementation of a LaVue plugins.

extra:
  recipe-maintainers:
    - jkotan
